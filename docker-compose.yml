services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: MoolyFTW12.
      MYSQL_DATABASE: argus_clone
      MYSQL_USER: nacho_verde
      MYSQL_PASSWORD: MoolyFTW12.
    ports:
      - "3306:3306"
